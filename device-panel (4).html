<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Device Ops · Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080b0f;
    --panel:#10151b;
    --panel-2:#161c24;
    --border:#232b35;
    --border-soft:#1a2129;
    --accent:#2dd4c8;
    --accent-dim:rgba(45,212,200,.14);
    --amber:#f5a623;
    --amber-dim:rgba(245,166,35,.14);
    --red:#ff5c6c;
    --red-dim:rgba(255,92,108,.14);
    --green:#34d399;
    --green-dim:rgba(52,211,153,.14);
    --violet:#a78bfa;
    --violet-dim:rgba(167,139,250,.14);
    --text:#eef3f7;
    --text-dim:#7d8b9a;
    --text-faint:#4d5b6a;
    --sans:'Inter',system-ui,sans-serif;
    --display:'Space Grotesk',var(--sans);
    --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(45,212,200,.07), transparent),
      radial-gradient(ellipse 700px 500px at 100% 10%, rgba(167,139,250,.05), transparent),
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    padding:22px 16px 70px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1120px;margin:0 auto;}

  /* ---------- HEADER ---------- */
  .topbar{
    display:flex;justify-content:space-between;align-items:flex-start;
    margin-bottom:18px;flex-wrap:wrap;gap:12px;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .mark{
    width:38px;height:38px;border-radius:10px;
    background:linear-gradient(135deg, var(--accent), var(--violet));
    display:flex;align-items:center;justify-content:center;
    font-family:var(--display);font-weight:700;font-size:15px;color:#06131a;
    flex-shrink:0;
  }
  .brand h1{font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:.2px;}
  .brand p{color:var(--text-dim);font-size:12.5px;margin-top:1px;}

  .sync-pill{
    display:flex;align-items:center;gap:8px;
    background:var(--panel);border:1px solid var(--border);
    border-radius:999px;padding:7px 14px 7px 10px;font-size:12px;color:var(--text-dim);
    font-family:var(--mono);
  }
  .sync-dot{
    width:8px;height:8px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 0 0 rgba(45,212,200,.6);
    animation:pulse 2s infinite;
  }
  .sync-dot.saving{background:var(--amber);animation:pulseAmber .9s infinite;}
  .sync-dot.offline{background:var(--red);animation:none;}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(45,212,200,.55);}
    70%{box-shadow:0 0 0 7px rgba(45,212,200,0);}
    100%{box-shadow:0 0 0 0 rgba(45,212,200,0);}
  }
  @keyframes pulseAmber{
    0%{box-shadow:0 0 0 0 rgba(245,166,35,.6);}
    70%{box-shadow:0 0 0 6px rgba(245,166,35,0);}
    100%{box-shadow:0 0 0 0 rgba(245,166,35,0);}
  }
  .sync-pill b{color:var(--text);font-weight:500;}

  /* ---------- TABS ---------- */
  .tabs{display:flex;gap:6px;margin-bottom:16px;background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:4px;width:fit-content;}
  .tab{
    background:transparent;color:var(--text-dim);border:none;
    padding:8px 18px;border-radius:8px;font-size:13.5px;font-weight:600;
    cursor:pointer;transition:.15s;font-family:var(--sans);
  }
  .tab:hover{color:var(--text);}
  .tab.active{background:var(--accent);color:#06131a;}

  /* ---------- LINK CARDS ---------- */
  .link-card{
    background:var(--panel);border:1px solid var(--border);
    border-radius:13px;padding:14px 16px;
    display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
    transition:.15s;
  }
  .link-card:hover{border-color:var(--border-soft);background:var(--panel-2);}
  .link-card .li-main{flex:1;min-width:200px;}
  .link-card .li-title{font-family:var(--display);font-size:15px;font-weight:600;margin-bottom:3px;}
  .link-card .li-url{font-family:var(--mono);font-size:12px;color:var(--accent);word-break:break-all;text-decoration:none;}
  .link-card .li-url:hover{text-decoration:underline;}
  .link-card .li-notes{font-size:12px;color:var(--text-dim);margin-top:4px;}
  .link-card .li-ts{font-family:var(--mono);font-size:10.5px;color:var(--text-faint);margin-top:6px;}

  @keyframes flashIn{
    0%{background:var(--accent-dim);border-color:var(--accent);}
    100%{background:var(--panel);border-color:var(--border);}
  }
  .entry.just-synced{animation:flashIn 1.8s ease-out;}

  /* ---------- HERO / READOUT ---------- */
  .hero{
    background:linear-gradient(160deg, var(--panel) 0%, var(--panel-2) 100%);
    border:1px solid var(--border);border-radius:18px;
    padding:24px 26px;margin-bottom:16px;
    display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;
    position:relative;overflow:hidden;
  }
  .hero::before{
    content:"";position:absolute;top:-40%;right:-10%;width:280px;height:280px;
    background:radial-gradient(circle, rgba(45,212,200,.08), transparent 70%);
    pointer-events:none;
  }
  .hero .main-figure .eyebrow{
    font-family:var(--mono);font-size:11px;letter-spacing:.08em;
    color:var(--accent);text-transform:uppercase;margin-bottom:6px;
  }
  .hero .main-figure .amt{
    font-family:var(--display);font-size:clamp(32px,5vw,44px);font-weight:700;
    color:var(--text);line-height:1;font-variant-numeric:tabular-nums;
  }
  .hero .main-figure .amt span{color:var(--green);}
  .hero .sub-readouts{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:14px;
    border-left:1px solid var(--border);padding-left:22px;
  }
  .readout span{display:block;font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;}
  .readout b{font-family:var(--mono);font-size:19px;font-weight:600;}
  .readout b.amber{color:var(--amber);}
  .readout small{display:block;color:var(--red);font-size:11px;margin-top:2px;font-family:var(--mono);}

  @media (max-width:640px){
    .hero{grid-template-columns:1fr;}
    .hero .sub-readouts{border-left:none;border-top:1px solid var(--border);padding-left:0;padding-top:16px;}
  }

  /* ---------- STAT CARDS (person breakdown) ---------- */
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
  .stat{
    flex:1;min-width:170px;background:var(--panel);border:1px solid var(--border);
    border-radius:12px;padding:13px 16px;transition:.15s;
  }
  .stat.clickable{cursor:pointer;}
  .stat.clickable:hover{border-color:var(--accent);transform:translateY(-2px);}
  .stat .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;}
  .stat span.label{font-size:11.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.03em;}
  .stat b{font-family:var(--mono);font-size:21px;font-weight:600;}
  .stat.earning b{color:var(--green);}
  .stat.pending b{color:var(--amber);}
  .stat .arrow{color:var(--text-faint);font-size:13px;}

  /* ---------- MODAL ---------- */
  .modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(4,6,9,.7);
    backdrop-filter:blur(3px);
    align-items:center;justify-content:center;padding:20px;z-index:50;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--panel);border:1px solid var(--border);
    border-radius:16px;max-width:540px;width:100%;max-height:80vh;
    display:flex;flex-direction:column;
  }
  .modal-head{
    display:flex;justify-content:space-between;align-items:center;
    padding:16px 18px;border-bottom:1px solid var(--border);
  }
  .modal-head h3{font-family:var(--display);font-size:15.5px;font-weight:600;}
  .modal-body{padding:14px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;}
  .hist-row{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--panel-2);border:1px solid var(--border-soft);
    border-radius:10px;padding:10px 12px;font-size:13px;
  }
  .hist-row .amt{color:var(--green);font-weight:700;font-family:var(--mono);}
  .hist-row.overdue{border-color:var(--red);}
  .hist-total{
    display:flex;justify-content:space-between;font-weight:700;
    padding:10px 12px;font-size:14px;border-top:1px solid var(--border);margin-top:4px;
    font-family:var(--mono);
  }

  .timeline{list-style:none;padding-left:2px;}
  .timeline li{position:relative;padding:2px 0 20px 26px;font-size:13px;}
  .timeline li::before{
    content:"";position:absolute;left:5px;top:5px;width:10px;height:10px;
    border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);
  }
  .timeline li::after{
    content:"";position:absolute;left:9px;top:16px;bottom:0;width:2px;background:var(--border);
  }
  .timeline li:last-child::after{display:none;}
  .timeline li:last-child::before{background:var(--green);box-shadow:0 0 0 3px var(--green-dim);}
  .timeline .t-status{font-weight:600;font-family:var(--display);}
  .timeline .t-date{color:var(--text-dim);font-size:11px;display:block;margin-top:2px;font-family:var(--mono);}
  .timeline .t-extra{color:var(--text-dim);font-size:11px;font-family:var(--mono);margin-right:8px;}

  /* ---------- FORM ---------- */
  form{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:16px;
    padding:22px;
    margin-bottom:18px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:14px;
    align-items:end;
  }
  form h2{
    grid-column:1/-1;font-family:var(--display);font-size:14.5px;color:var(--text);
    font-weight:600;margin-bottom:-2px;display:flex;align-items:center;gap:8px;
  }
  form h2::before{content:"";width:4px;height:14px;background:var(--accent);border-radius:2px;display:inline-block;}
  .field.full{grid-column:1/-1;}
  .field label{display:block;font-size:11.5px;color:var(--text-dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em;}
  .field input, .field select, .field textarea{
    width:100%;background:var(--panel-2);
    border:1px solid var(--border);border-radius:9px;
    padding:10px 12px;color:var(--text);font-size:14px;outline:none;
    font-family:var(--sans);
  }
  #deviceId, #deviceNumber, #vmCode, #amount{font-family:var(--mono);}
  .field textarea{resize:vertical;min-height:44px;}
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);}
  button{
    background:var(--accent);color:#06131a;border:none;
    border-radius:9px;padding:11px 16px;font-size:14px;font-weight:600;
    cursor:pointer;transition:.15s;font-family:var(--sans);
  }
  button:hover{filter:brightness(1.08);}
  button.secondary{background:var(--panel-2);border:1px solid var(--border);color:var(--text-dim);}
  button.secondary:hover{color:var(--text);border-color:var(--text-faint);}
  .msg{grid-column:1/-1;font-size:13px;min-height:16px;}
  .msg.err{color:var(--red);}
  .msg.ok{color:var(--green);}

  /* ---------- TOOLBAR ---------- */
  .toolbar{
    display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center;
    justify-content:space-between;
  }
  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .filters select, .filters input{
    background:var(--panel);border:1px solid var(--border);color:var(--text);
    padding:8px 12px;border-radius:9px;font-size:13px;
  }
  .filters input[type="text"]{min-width:190px;font-family:var(--mono);}
  .filters input[type="text"]::placeholder{font-family:var(--sans);}
  .filters .date-sep{color:var(--text-faint);font-size:12px;}
  #exportBtn{padding:8px 14px;font-size:13px;}

  /* ---------- LIST ---------- */
  .list{display:flex;flex-direction:column;gap:9px;}
  .entry{
    background:var(--panel);border:1px solid var(--border);
    border-radius:13px;padding:14px 16px;
    display:flex;flex-direction:column;gap:8px;
    transition:.15s;
  }
  .entry:hover{border-color:var(--border-soft);background:var(--panel-2);}
  .entry.overdue{border-color:var(--red);}
  .entry-top{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;}
  .entry .main{display:flex;flex-wrap:wrap;gap:14px;align-items:center;}
  .entry .col span{font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;display:block;}
  .entry .col b{display:block;font-size:14px;font-family:var(--mono);font-weight:500;}
  .badge{
    padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:600;
    white-space:nowrap;font-family:var(--sans);
  }
  .badge.web{background:var(--accent-dim);color:var(--accent);}
  .badge.red{background:var(--red-dim);color:var(--red);}
  .badge.vm{background:var(--violet-dim);color:var(--violet);}
  .badge.paid{background:var(--green-dim);color:var(--green);}
  .badge.due{background:var(--red-dim);color:var(--red);}
  .person-tag{
    padding:3px 9px;border-radius:6px;font-size:11px;font-weight:700;
    background:var(--panel-2);border:1px solid var(--border);font-family:var(--mono);
  }
  .notes-line{font-size:12px;color:var(--text-dim);}
  .entry-foot{
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;
    border-top:1px solid var(--border-soft);padding-top:8px;
  }
  .ts-line{font-size:11px;color:var(--text-faint);font-family:var(--mono);display:flex;gap:12px;flex-wrap:wrap;}
  .ts-line b{color:var(--text-dim);font-weight:500;}
  .actions{display:flex;gap:8px;flex-wrap:wrap;}
  .actions button{padding:7px 12px;font-size:12px;}
  .empty{color:var(--text-dim);text-align:center;padding:44px 0;font-size:14px;}

  /* ---------- MOBILE ---------- */
  @media (max-width:600px){
    body{padding:14px 10px 90px;}
    .topbar{flex-direction:column;align-items:stretch;}
    .sync-pill{align-self:flex-start;}
    .brand h1{font-size:17px;}

    .hero{padding:18px 16px;border-radius:14px;}
    .sub-readouts{grid-template-columns:repeat(2,1fr);gap:14px 10px;}

    .stats{flex-direction:column;}
    .stat{min-width:0;}

    form{grid-template-columns:1fr;padding:16px;border-radius:14px;}
    .field, .field.full{grid-column:1/-1;}
    form .field[style*="display:flex"]{flex-direction:column;}
    form .field[style*="display:flex"] button{width:100%;}

    .toolbar{flex-direction:column;align-items:stretch;}
    .filters{flex-direction:column;align-items:stretch;}
    .filters select, .filters input{width:100%;}
    .filters .date-sep{display:none;}
    #exportBtn{width:100%;}

    .entry{padding:12px;}
    .entry-top{grid-template-columns:1fr;}
    .entry .main{gap:10px;}
    .actions{width:100%;}
    .actions button{flex:1;min-width:0;}
    .entry-foot{flex-direction:column;align-items:flex-start;gap:4px;}
    .ts-line{gap:14px;}

    .modal{max-height:88vh;}
    .modal-body{padding:12px 14px;}

    button{padding:12px 16px;font-size:14.5px;}

    .tabs{width:100%;}
    .tab{flex:1;text-align:center;}
    .link-card{flex-direction:column;align-items:stretch;}
    .link-card .actions{width:100%;}
    .link-card .actions button{flex:1;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <div class="mark">DP</div>
      <div>
        <h1>Device Ops</h1>
        <p>Bhavishay aur Arsalan ke devices ka status ek jagah</p>
      </div>
    </div>
    <div class="sync-pill">
      <span class="sync-dot"></span>
      <span id="syncStatus">Connecting…</span>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tabDevicesBtn" onclick="switchTab('devices')">Devices</button>
    <button class="tab" id="tabLinksBtn" onclick="switchTab('links')">Links</button>
  </div>

  <div id="devicesTab">
  <div class="hero">
    <div class="main-figure">
      <div class="eyebrow">Total Earning</div>
      <div class="amt"><span id="totalEarningAmt">₹0</span></div>
    </div>
    <div class="sub-readouts">
      <div class="readout"><span>Total Devices</span><b id="rTotal">0</b></div>
      <div class="readout"><span>Bhavishay</span><b id="rBhavishay">0</b></div>
      <div class="readout"><span>Arsalan</span><b id="rArsalan">0</b></div>
      <div class="readout"><span>Pending Payment</span><b class="amber" id="rPending">0</b>
        <small id="rOverdue" style="display:none;"></small>
      </div>
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <form id="entryForm">
    <h2 id="formTitle">Naya Device Add Karo</h2>
    <div class="field">
      <label>Device Name / ID</label>
      <input type="text" id="deviceId" placeholder="e.g. f7f3fc291316c7df" required>
    </div>
    <div class="field">
      <label>Device Number</label>
      <input type="text" id="deviceNumber" placeholder="e.g. 9876543210" required>
    </div>
    <div class="field">
      <label>Person</label>
      <select id="person" required>
        <option value="Bhavishay">Bhavishay</option>
        <option value="Arsalan">Arsalan</option>
      </select>
    </div>
    <div class="field">
      <label>Status</label>
      <select id="status" required>
        <option value="Only Web Work">Only Web Work</option>
        <option value="App Install Red">App Install Red</option>
        <option value="App Install VM">App Install VM</option>
        <option value="Payment Received">Payment Received</option>
      </select>
    </div>
    <div class="field" id="vmCodeField" style="display:none;">
      <label>VM Device Code</label>
      <input type="text" id="vmCode" placeholder="e.g. VM-4521">
    </div>
    <div class="field" id="amountField" style="display:none;">
      <label>Amount Received (₹)</label>
      <input type="number" id="amount" placeholder="e.g. 500" min="0" step="0.01">
    </div>
    <div class="field" id="dueDateField">
      <label>Payment Due Date (optional)</label>
      <input type="date" id="dueDate">
    </div>
    <div class="field full">
      <label>Notes (optional)</label>
      <textarea id="notes" placeholder="Koi extra detail..."></textarea>
    </div>
    <div class="field" style="display:flex;gap:8px;">
      <button type="submit" id="submitBtn" style="flex:1;">Save Entry</button>
      <button type="button" id="cancelEdit" class="secondary" style="display:none;">Cancel</button>
    </div>
    <div class="msg" id="formMsg"></div>
  </form>

  <div class="toolbar">
    <div class="filters">
      <input type="text" id="searchBox" placeholder="Device ID ya number search karo...">
      <select id="filterPerson">
        <option value="">Sabhi Person</option>
        <option value="Bhavishay">Bhavishay</option>
        <option value="Arsalan">Arsalan</option>
      </select>
      <select id="filterStatus">
        <option value="">Sabhi Status</option>
        <option value="Only Web Work">Only Web Work</option>
        <option value="App Install Red">App Install Red</option>
        <option value="App Install VM">App Install VM</option>
        <option value="Payment Received">Payment Received</option>
      </select>
      <input type="date" id="filterFrom">
      <span class="date-sep">se</span>
      <input type="date" id="filterTo">
      <span class="date-sep">tak</span>
    </div>
    <button id="exportBtn" class="secondary">Export CSV</button>
  </div>

  <div class="list" id="list">
    <div class="empty">Loading…</div>
  </div>
  </div>

  <div id="linksTab" style="display:none;">
    <form id="linkForm">
      <h2 id="linkFormTitle">Naya Link Add Karo</h2>
      <div class="field full">
        <label>Title</label>
        <input type="text" id="linkTitle" placeholder="e.g. Firebase Console" required>
      </div>
      <div class="field full">
        <label>URL</label>
        <input type="text" id="linkUrl" placeholder="e.g. https://console.firebase.google.com" required>
      </div>
      <div class="field full">
        <label>Notes (optional)</label>
        <input type="text" id="linkNotes" placeholder="Kis kaam ke liye hai...">
      </div>
      <div class="field" style="display:flex;gap:8px;">
        <button type="submit" id="linkSubmitBtn" style="flex:1;">Save Link</button>
        <button type="button" id="linkCancelEdit" class="secondary" style="display:none;">Cancel</button>
      </div>
      <div class="msg" id="linkFormMsg"></div>
    </form>

    <div class="toolbar">
      <div class="filters">
        <input type="text" id="linkSearchBox" placeholder="Link title ya URL search karo...">
      </div>
    </div>

    <div class="list" id="linkList">
      <div class="empty">Loading…</div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle">History</h3>
      <button class="secondary" id="modalClose">Band Karo</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
  // --- FIREBASE CONFIG ---
  const firebaseConfig = {
    apiKey: "AIzaSyBcXm5QQaYCCddVXNgGqTBAszdKEK-0PJQ",
    authDomain: "multi-service-app-77dd8.firebaseapp.com",
    projectId: "multi-service-app-77dd8",
    storageBucket: "multi-service-app-77dd8.appspot.com",
    messagingSenderId: "123732555482",
    appId: "1:123732555482:web:ea47c825e0dbb504f597e3"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const col = db.collection("devices");
  const linksCol = db.collection("links");

  window.switchTab = (tab) => {
    document.getElementById("devicesTab").style.display = tab === "devices" ? "block" : "none";
    document.getElementById("linksTab").style.display = tab === "links" ? "block" : "none";
    document.getElementById("tabDevicesBtn").classList.toggle("active", tab === "devices");
    document.getElementById("tabLinksBtn").classList.toggle("active", tab === "links");
  };

  let allEntries = [];
  let editingId = null;
  let lastSyncAt = null;

  const badgeClass = {
    "Only Web Work": "web",
    "App Install Red": "red",
    "App Install VM": "vm",
    "Payment Received": "paid"
  };

  const form = document.getElementById("entryForm");
  const formMsg = document.getElementById("formMsg");
  const submitBtn = document.getElementById("submitBtn");
  const cancelBtn = document.getElementById("cancelEdit");
  const formTitle = document.getElementById("formTitle");
  const statusSelect = document.getElementById("status");
  const vmCodeField = document.getElementById("vmCodeField");
  const vmCodeInput = document.getElementById("vmCode");
  const amountField = document.getElementById("amountField");
  const amountInput = document.getElementById("amount");
  const dueDateField = document.getElementById("dueDateField");
  const dueDateInput = document.getElementById("dueDate");
  const notesInput = document.getElementById("notes");

  function toggleVmField(){
    const isVm = statusSelect.value === "App Install VM";
    vmCodeField.style.display = isVm ? "block" : "none";
    vmCodeInput.required = isVm;
    if(!isVm) vmCodeInput.value = "";
  }
  function toggleAmountField(){
    const isPaid = statusSelect.value === "Payment Received";
    amountField.style.display = isPaid ? "block" : "none";
    amountInput.required = isPaid;
    if(!isPaid) amountInput.value = "";
    dueDateField.style.display = isPaid ? "none" : "block";
    if(isPaid) dueDateInput.value = "";
  }
  statusSelect.addEventListener("change", () => { toggleVmField(); toggleAmountField(); });
  toggleVmField();
  toggleAmountField();

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const newStatus = statusSelect.value;
    const data = {
      deviceId: document.getElementById("deviceId").value.trim(),
      deviceNumber: document.getElementById("deviceNumber").value.trim(),
      person: document.getElementById("person").value,
      status: newStatus,
      vmCode: newStatus === "App Install VM" ? vmCodeInput.value.trim() : "",
      amount: newStatus === "Payment Received" ? (parseFloat(amountInput.value) || 0) : 0,
      dueDate: newStatus !== "Payment Received" ? (dueDateInput.value || "") : "",
      notes: notesInput.value.trim(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    if(!data.deviceId || !data.deviceNumber){
      formMsg.textContent = "Device Name aur Number dono bharo.";
      formMsg.className = "msg err";
      return;
    }
    if(data.status === "App Install VM" && !data.vmCode){
      formMsg.textContent = "VM Device Code bharo.";
      formMsg.className = "msg err";
      return;
    }
    if(data.status === "Payment Received" && !data.amount){
      formMsg.textContent = "Amount bharo.";
      formMsg.className = "msg err";
      return;
    }
    try{
      submitBtn.disabled = true;
      submitBtn.textContent = "Uploading…";
      const historyEntry = {
        status: data.status,
        amount: data.amount || null,
        vmCode: data.vmCode || null,
        at: new Date()
      };
      if(editingId){
        const existing = allEntries.find(x => x.id === editingId);
        const statusChanged = existing && existing.status !== data.status;
        if(statusChanged){
          data.statusHistory = firebase.firestore.FieldValue.arrayUnion(historyEntry);
        }
        await col.doc(editingId).update(data);
        formMsg.textContent = "Entry update ho gayi.";
      } else {
        data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
        data.statusHistory = [historyEntry];
        await col.add(data);
        formMsg.textContent = "Entry save ho gayi.";
      }
      formMsg.className = "msg ok";
      resetForm();
    } catch(err){
      formMsg.textContent = "Error: " + err.message;
      formMsg.className = "msg err";
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Save Entry";
    }
  });

  cancelBtn.addEventListener("click", resetForm);

  function resetForm(){
    form.reset();
    editingId = null;
    formTitle.textContent = "Naya Device Add Karo";
    submitBtn.textContent = "Save Entry";
    cancelBtn.style.display = "none";
    toggleVmField();
    toggleAmountField();
  }

  function startEdit(entry){
    editingId = entry.id;
    document.getElementById("deviceId").value = entry.deviceId || "";
    document.getElementById("deviceNumber").value = entry.deviceNumber || "";
    document.getElementById("person").value = entry.person || "Bhavishay";
    document.getElementById("status").value = entry.status || "Only Web Work";
    toggleVmField();
    toggleAmountField();
    vmCodeInput.value = entry.vmCode || "";
    amountInput.value = entry.amount || "";
    dueDateInput.value = entry.dueDate || "";
    notesInput.value = entry.notes || "";
    formTitle.textContent = "Entry Edit Karo";
    submitBtn.textContent = "Update Entry";
    cancelBtn.style.display = "inline-block";
    window.scrollTo({top:0, behavior:"smooth"});
  }

  async function deleteEntry(id){
    if(!confirm("Ye entry delete karni hai?")) return;
    await col.doc(id).delete();
  }

  ["filterPerson","filterStatus","filterFrom","filterTo"].forEach(id => {
    document.getElementById(id).addEventListener("change", render);
  });
  document.getElementById("searchBox").addEventListener("input", render);
  document.getElementById("exportBtn").addEventListener("click", exportCsv);

  function isOverdue(entry){
    if(entry.status === "Payment Received" || !entry.dueDate) return false;
    const today = new Date(); today.setHours(0,0,0,0);
    const due = new Date(entry.dueDate);
    return due < today;
  }

  function render(){
    const listEl = document.getElementById("list");
    const statsEl = document.getElementById("stats");
    const fp = document.getElementById("filterPerson").value;
    const fs = document.getElementById("filterStatus").value;
    const q = document.getElementById("searchBox").value.trim().toLowerCase();
    const from = document.getElementById("filterFrom").value;
    const to = document.getElementById("filterTo").value;

    let entries = allEntries.filter(e => {
      if(fp && e.person !== fp) return false;
      if(fs && e.status !== fs) return false;
      if(q && !((e.deviceId||"").toLowerCase().includes(q) || (e.deviceNumber||"").toLowerCase().includes(q))) return false;
      if((from || to) && e.createdAt && e.createdAt.seconds){
        const d = new Date(e.createdAt.seconds * 1000);
        if(from && d < new Date(from)) return false;
        if(to && d > new Date(to + "T23:59:59")) return false;
      }
      return true;
    });

    // ---- hero + stats (based on full data, not filtered) ----
    const total = allEntries.length;
    const paidEntries = allEntries.filter(e => e.status === "Payment Received");
    const bhavishayEarning = paidEntries.filter(e => e.person === "Bhavishay").reduce((s,e) => s + (Number(e.amount)||0), 0);
    const arsalanEarning = paidEntries.filter(e => e.person === "Arsalan").reduce((s,e) => s + (Number(e.amount)||0), 0);
    const bhavishayCount = allEntries.filter(e => e.person === "Bhavishay").length;
    const arsalanCount = allEntries.filter(e => e.person === "Arsalan").length;
    const pendingEntries = allEntries.filter(e => e.status !== "Payment Received");
    const overdueCount = pendingEntries.filter(isOverdue).length;

    document.getElementById("totalEarningAmt").textContent = "₹" + (bhavishayEarning + arsalanEarning).toLocaleString('en-IN');
    document.getElementById("rTotal").textContent = total;
    document.getElementById("rBhavishay").textContent = bhavishayCount;
    document.getElementById("rArsalan").textContent = arsalanCount;
    document.getElementById("rPending").textContent = pendingEntries.length;
    const rOverdue = document.getElementById("rOverdue");
    if(overdueCount){
      rOverdue.style.display = "block";
      rOverdue.textContent = overdueCount + " overdue";
    } else {
      rOverdue.style.display = "none";
    }

    statsEl.innerHTML = `
      <div class="stat earning clickable" onclick="showHistory('Bhavishay')">
        <div class="top"><span class="label">Bhavishay Earning</span><span class="arrow">→</span></div>
        <b>₹${bhavishayEarning.toLocaleString('en-IN')}</b>
      </div>
      <div class="stat earning clickable" onclick="showHistory('Arsalan')">
        <div class="top"><span class="label">Arsalan Earning</span><span class="arrow">→</span></div>
        <b>₹${arsalanEarning.toLocaleString('en-IN')}</b>
      </div>
      <div class="stat pending clickable" onclick="showPending()">
        <div class="top"><span class="label">Pending Payment</span><span class="arrow">→</span></div>
        <b>${pendingEntries.length}</b>
      </div>
    `;

    if(entries.length === 0){
      listEl.innerHTML = `<div class="empty">Koi entry nahi mili.</div>`;
      return;
    }

    listEl.innerHTML = entries.map(e => `
      <div class="entry ${isOverdue(e) ? 'overdue' : ''}">
        <div class="entry-top">
          <div class="main">
            <div class="col">
              <span>Device</span>
              <b>${escapeHtml(e.deviceId)}</b>
            </div>
            <div class="col">
              <span>Number</span>
              <b>${escapeHtml(e.deviceNumber)}</b>
            </div>
            <span class="person-tag">${escapeHtml(e.person)}</span>
            <span class="badge ${badgeClass[e.status] || 'web'}">${escapeHtml(e.status)}</span>
            ${e.status === "App Install VM" && e.vmCode ? `
            <div class="col">
              <span>VM Code</span>
              <b>${escapeHtml(e.vmCode)}</b>
            </div>` : ""}
            ${e.status === "Payment Received" && e.amount ? `
            <div class="col">
              <span>Amount</span>
              <b style="color:var(--green);">₹${Number(e.amount).toLocaleString('en-IN')}</b>
            </div>` : ""}
            ${e.status !== "Payment Received" && e.dueDate ? `
            <span class="badge ${isOverdue(e) ? 'due' : 'web'}">${isOverdue(e) ? 'Overdue' : 'Due'}: ${formatSimpleDate(e.dueDate)}</span>
            ` : ""}
          </div>
          <div class="actions">
            <button class="secondary" onclick="showTimeline('${e.id}')">History</button>
            <button class="secondary" onclick="editRow('${e.id}')">Edit</button>
            <button class="secondary" onclick="delRow('${e.id}')">Delete</button>
          </div>
        </div>
        ${e.notes ? `<div class="notes-line">📝 ${escapeHtml(e.notes)}</div>` : ""}
        <div class="entry-foot">
          <div class="ts-line">
            <span>Added: <b>${relativeTime(e.createdAt)}</b></span>
            <span>Updated: <b>${relativeTime(e.updatedAt)}</b></span>
          </div>
        </div>
      </div>
    `).join("");
  }

  window.editRow = (id) => {
    const entry = allEntries.find(e => e.id === id);
    if(entry) startEdit(entry);
  };
  window.delRow = (id) => deleteEntry(id);

  const modalOverlay = document.getElementById("modalOverlay");
  const modalTitle = document.getElementById("modalTitle");
  const modalBody = document.getElementById("modalBody");
  document.getElementById("modalClose").addEventListener("click", closeModal);
  modalOverlay.addEventListener("click", (e) => { if(e.target === modalOverlay) closeModal(); });

  function closeModal(){ modalOverlay.classList.remove("open"); }

  window.showHistory = (person) => {
    const rows = allEntries
      .filter(e => e.person === person && e.status === "Payment Received")
      .sort((a,b) => (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));
    const total = rows.reduce((s,e) => s + (Number(e.amount)||0), 0);

    modalTitle.textContent = person + " · Payment History";
    if(rows.length === 0){
      modalBody.innerHTML = `<div class="empty">Abhi tak koi payment nahi.</div>`;
    } else {
      modalBody.innerHTML = rows.map(e => `
        <div class="hist-row">
          <div>
            <b>${escapeHtml(e.deviceId)}</b><br>
            <span style="color:var(--text-dim);font-size:11px;">${escapeHtml(e.deviceNumber)} · ${formatDate(e.createdAt)}</span>
          </div>
          <div class="amt">₹${Number(e.amount).toLocaleString('en-IN')}</div>
        </div>
      `).join("") + `<div class="hist-total"><span>Total</span><span>₹${total.toLocaleString('en-IN')}</span></div>`;
    }
    modalOverlay.classList.add("open");
  };

  window.showPending = () => {
    const rows = allEntries
      .filter(e => e.status !== "Payment Received")
      .sort((a,b) => {
        const ao = isOverdue(a), bo = isOverdue(b);
        if(ao !== bo) return ao ? -1 : 1;
        return (a.dueDate || "9999").localeCompare(b.dueDate || "9999");
      });

    modalTitle.textContent = "Pending Payment Devices";
    if(rows.length === 0){
      modalBody.innerHTML = `<div class="empty">Koi pending payment nahi hai.</div>`;
    } else {
      modalBody.innerHTML = rows.map(e => `
        <div class="hist-row ${isOverdue(e) ? 'overdue' : ''}">
          <div>
            <b>${escapeHtml(e.deviceId)}</b><br>
            <span style="color:var(--text-dim);font-size:11px;">${escapeHtml(e.person)} · ${escapeHtml(e.status)}</span>
          </div>
          <div style="text-align:right;font-size:12px;color:${isOverdue(e) ? 'var(--red)' : 'var(--text-dim)'};font-family:var(--mono);">
            ${e.dueDate ? (isOverdue(e) ? 'Overdue: ' : 'Due: ') + formatSimpleDate(e.dueDate) : 'Koi due date nahi'}
          </div>
        </div>
      `).join("");
    }
    modalOverlay.classList.add("open");
  };

  window.showTimeline = (id) => {
    const entry = allEntries.find(e => e.id === id);
    if(!entry) return;
    modalTitle.textContent = entry.deviceId + " · Status Timeline";
    const hist = (entry.statusHistory || []).slice().sort((a,b) => (a.at?.seconds||0) - (b.at?.seconds||0));
    if(hist.length === 0){
      modalBody.innerHTML = `<div class="empty">Koi history record nahi mila.</div>`;
    } else {
      modalBody.innerHTML = `<ul class="timeline">` + hist.map(h => `
        <li>
          <span class="t-status">${escapeHtml(h.status)}</span>
          <span class="t-date">${formatDate(h.at)}</span>
          ${h.amount ? `<span class="t-extra">₹${Number(h.amount).toLocaleString('en-IN')}</span>` : ""}
          ${h.vmCode ? `<span class="t-extra">VM: ${escapeHtml(h.vmCode)}</span>` : ""}
        </li>
      `).join("") + `</ul>`;
    }
    modalOverlay.classList.add("open");
  };

  function exportCsv(){
    const headers = ["Device ID","Device Number","Person","Status","VM Code","Amount","Due Date","Notes","Created At","Updated At"];
    const rows = allEntries.map(e => [
      e.deviceId, e.deviceNumber, e.person, e.status, e.vmCode || "",
      e.amount || "", e.dueDate || "", (e.notes || "").replace(/\n/g," "), formatDate(e.createdAt), formatDate(e.updatedAt)
    ]);
    const csv = [headers, ...rows].map(r =>
      r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(",")
    ).join("\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "devices-" + new Date().toISOString().slice(0,10) + ".csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function formatDate(ts){
    if(!ts || !ts.seconds) return "--";
    const d = new Date(ts.seconds * 1000);
    return d.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' }) +
      " " + d.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit' });
  }
  function formatSimpleDate(dateStr){
    if(!dateStr) return "--";
    const d = new Date(dateStr);
    return d.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
  }
  function relativeTime(ts){
    if(!ts || !ts.seconds) return "--";
    const diffSec = Math.floor((Date.now() - ts.seconds * 1000) / 1000);
    if(diffSec < 10) return "just now";
    if(diffSec < 60) return diffSec + "s ago";
    const diffMin = Math.floor(diffSec / 60);
    if(diffMin < 60) return diffMin + "m ago";
    const diffHr = Math.floor(diffMin / 60);
    if(diffHr < 24) return diffHr + "h ago";
    const diffDay = Math.floor(diffHr / 24);
    if(diffDay < 7) return diffDay + "d ago";
    return formatSimpleDate(new Date(ts.seconds * 1000).toISOString().slice(0,10));
  }

  function escapeHtml(str){
    return String(str || "").replace(/[&<>"']/g, m => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[m]));
  }

  // ---------------- LINKS SECTION ----------------
  let allLinks = [];
  let editingLinkId = null;

  const linkForm = document.getElementById("linkForm");
  const linkFormMsg = document.getElementById("linkFormMsg");
  const linkSubmitBtn = document.getElementById("linkSubmitBtn");
  const linkCancelBtn = document.getElementById("linkCancelEdit");
  const linkFormTitle = document.getElementById("linkFormTitle");
  const linkTitleInput = document.getElementById("linkTitle");
  const linkUrlInput = document.getElementById("linkUrl");
  const linkNotesInput = document.getElementById("linkNotes");

  function normalizeUrl(u){
    u = u.trim();
    if(!u) return u;
    if(!/^https?:\/\//i.test(u)) u = "https://" + u;
    return u;
  }

  linkForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const data = {
      title: linkTitleInput.value.trim(),
      url: normalizeUrl(linkUrlInput.value),
      notes: linkNotesInput.value.trim(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    if(!data.title || !data.url){
      linkFormMsg.textContent = "Title aur URL dono bharo.";
      linkFormMsg.className = "msg err";
      return;
    }
    try{
      linkSubmitBtn.disabled = true;
      linkSubmitBtn.textContent = "Saving…";
      if(editingLinkId){
        await linksCol.doc(editingLinkId).update(data);
        linkFormMsg.textContent = "Link update ho gaya.";
      } else {
        data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
        await linksCol.add(data);
        linkFormMsg.textContent = "Link save ho gaya.";
      }
      linkFormMsg.className = "msg ok";
      resetLinkForm();
    } catch(err){
      linkFormMsg.textContent = "Error: " + err.message;
      linkFormMsg.className = "msg err";
    } finally {
      linkSubmitBtn.disabled = false;
      linkSubmitBtn.textContent = "Save Link";
    }
  });

  linkCancelBtn.addEventListener("click", resetLinkForm);

  function resetLinkForm(){
    linkForm.reset();
    editingLinkId = null;
    linkFormTitle.textContent = "Naya Link Add Karo";
    linkSubmitBtn.textContent = "Save Link";
    linkCancelBtn.style.display = "none";
  }

  function startEditLink(link){
    editingLinkId = link.id;
    linkTitleInput.value = link.title || "";
    linkUrlInput.value = link.url || "";
    linkNotesInput.value = link.notes || "";
    linkFormTitle.textContent = "Link Edit Karo";
    linkSubmitBtn.textContent = "Update Link";
    linkCancelBtn.style.display = "inline-block";
    window.scrollTo({top:0, behavior:"smooth"});
  }

  window.editLink = (id) => {
    const l = allLinks.find(x => x.id === id);
    if(l) startEditLink(l);
  };
  window.deleteLink = async (id) => {
    if(!confirm("Ye link delete karna hai?")) return;
    await linksCol.doc(id).delete();
  };
  window.copyLink = (url) => {
    navigator.clipboard.writeText(url).then(() => {
      const el = document.getElementById("linkFormMsg");
    }).catch(() => {});
    const btns = document.querySelectorAll(`[data-copy="${CSS.escape(url)}"]`);
    btns.forEach(b => { const orig = b.textContent; b.textContent = "Copied!"; setTimeout(() => b.textContent = orig, 1200); });
  };

  document.getElementById("linkSearchBox").addEventListener("input", renderLinks);

  function renderLinks(){
    const listEl = document.getElementById("linkList");
    const q = document.getElementById("linkSearchBox").value.trim().toLowerCase();
    let links = allLinks.filter(l =>
      !q || (l.title||"").toLowerCase().includes(q) || (l.url||"").toLowerCase().includes(q)
    );
    if(links.length === 0){
      listEl.innerHTML = `<div class="empty">Koi link nahi mila.</div>`;
      return;
    }
    listEl.innerHTML = links.map(l => `
      <div class="link-card">
        <div class="li-main">
          <div class="li-title">${escapeHtml(l.title)}</div>
          <a class="li-url" href="${escapeHtml(l.url)}" target="_blank" rel="noopener">${escapeHtml(l.url)}</a>
          ${l.notes ? `<div class="li-notes">${escapeHtml(l.notes)}</div>` : ""}
          <div class="li-ts">Added ${relativeTime(l.createdAt)} · Updated ${relativeTime(l.updatedAt)}</div>
        </div>
        <div class="actions">
          <button class="secondary" data-copy="${escapeHtml(l.url)}" onclick="copyLink('${escapeHtml(l.url).replace(/'/g,"\\'")}')">Copy</button>
          <button class="secondary" onclick="window.open('${escapeHtml(l.url).replace(/'/g,"\\'")}','_blank')">Open</button>
          <button class="secondary" onclick="editLink('${l.id}')">Edit</button>
          <button class="secondary" onclick="deleteLink('${l.id}')">Delete</button>
        </div>
      </div>
    `).join("");
  }

  linksCol.orderBy("createdAt", "desc").onSnapshot(snap => {
    allLinks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderLinks();
  }, err => {
    document.getElementById("linkList").innerHTML =
      `<div class="empty">Firestore error: ${escapeHtml(err.message)}</div>`;
  });

  // ---- live sync status pill (reflects real Firestore write/sync state) ----
  const syncStatusEl = document.getElementById("syncStatus");
  const syncDotEl = document.querySelector(".sync-dot");
  let syncMode = "connecting"; // connecting | saving | synced | offline

  function updateSyncPill(){
    syncDotEl.classList.remove("saving","offline");
    if(syncMode === "connecting"){
      syncStatusEl.textContent = "Connecting…";
      return;
    }
    if(syncMode === "offline"){
      syncDotEl.classList.add("offline");
      syncStatusEl.textContent = "Offline · will sync";
      return;
    }
    if(syncMode === "saving"){
      syncDotEl.classList.add("saving");
      syncStatusEl.textContent = "Saving…";
      return;
    }
    if(!lastSyncAt){ syncStatusEl.textContent = "Connecting…"; return; }
    const diffSec = Math.floor((Date.now() - lastSyncAt) / 1000);
    const label = diffSec < 5 ? "just now" : (diffSec < 60 ? diffSec + "s ago" : Math.floor(diffSec/60) + "m ago");
    syncStatusEl.innerHTML = `Synced <b>${label}</b>`;
  }
  setInterval(updateSyncPill, 1000);
  setInterval(render, 30000); // refresh relative timestamps periodically

  let firstSnapshot = true;
  col.orderBy("createdAt", "desc").onSnapshot({ includeMetadataChanges: true }, snap => {
    allEntries = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    const pending = snap.metadata.hasPendingWrites;
    const fromCache = snap.metadata.fromCache;

    if(pending){
      syncMode = "saving";
    } else if(fromCache){
      syncMode = "offline";
    } else {
      syncMode = "synced";
      lastSyncAt = Date.now();
    }
    updateSyncPill();
    render();

    if(!firstSnapshot && !pending && !fromCache){
      // briefly flash the most recently touched entry to show it just synced
      const latest = document.querySelector(".entry");
      if(latest) { latest.classList.add("just-synced"); setTimeout(() => latest.classList.remove("just-synced"), 1800); }
    }
    firstSnapshot = false;
  }, err => {
    syncMode = "offline";
    updateSyncPill();
    document.getElementById("list").innerHTML =
      `<div class="empty">Firestore error: ${escapeHtml(err.message)}</div>`;
  });
</script>
</body>
</html>
